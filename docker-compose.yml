services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-mida-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_mida}
      POSTGRES_USER: ${POSTGRES_USER:-crm_mida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - crm_mida_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_mida} -d ${POSTGRES_DB:-crm_mida}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  crm_mida_postgres_data:
